<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var minh = "crab";
        var thuc = /[ra]/g;
        var truong = minh.match(thuc);
        console.log(truong);
        var van = "grey gray groy".match(/gr[ea]y/g);
        document.write(van)
        var vann = "Hello".match(/[ueoai]/g);
        var thucc = vann.length;
        document.write(thucc);
        console.log(van);
        var vax = "12345".match(/[135]/g);
        document.write(vax);
        var vab = "Hello HELLO hello".match(/[hH]ello/g);
       document.write(vab);
       var vam = "Xin chào, bạn khỏe không? Tốt!".match(/[,.?!]/g);
       var vamx = vam.length;
       document.write("Số dấu câu là:",vamx);
       var thucx = "abcdef".match(/[^abc]/g);
       document.write(thucx);
       var thucb = "a1b2c3".replace(/[^0-9]/g, "");
       console.log(thucb);
       var minhn = "programming".replace(/[^ueoai]/g, "");
       console.log(minhn);
       var abc = 'nói "xin chào" và "tạm biệt"'.replace(/"[^"]"/g);
       console.log(abc);
    </script>
</body>
</html>
