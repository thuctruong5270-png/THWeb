<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jackson Electronics - Registration Form</title>
  <style>
    body {
      background-color: #99ccff;
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
    }

    .form-container {
      width: 550px;
      margin: 0 auto;
    }
    .header-logo {
      background-color: #00ffff;
      border: 2px solid #000;
      border-radius: 12px;
      text-align: center;
      width: 260px;
      margin: 0 auto 20px auto;
      box-shadow: 4px 4px 0px #777;
      font-family: "Times New Roman", Times, serif;
      overflow: hidden;
    }

    .header-logo .logo-top {
      font-size: 26px;
      font-weight: bold;
      padding: 2px 0;
    }

    .header-logo hr {
      border: none;
      border-top: 2.5px solid #000;
      margin: 0;
    }

    .header-logo .logo-bottom {
      font-size: 26px;
      font-weight: bold;
      padding: 2px 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 5px;
      font-family: "Times New Roman", Times, serif;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #777;
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 4px 0;
      vertical-align: middle;
      font-size: 14px;
    }

    input[type="text"], select, textarea {
      font-size: 14px;
    }

    .options-col {
      float: left;
      width: 45%;
    }

    .button-container {
      text-align: center;
      margin-top: 15px;
    }

    .button-container input {
      margin: 0 5px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="header-logo">
    <div class="logo-top">Jackson</div>
    <hr>
    <div class="logo-bottom">Electronics</div>
  </div>

  <h2>Registration Form</h2>
  <div class="subtitle">Register your Jackson Electronics product here</div>

  <form action="#" method="post">
    <table>
      <tr>
        <td style="width: 25%;">First Name:</td>
        <td style="width: 35%;"><input type="text" name="firstName" style="width: 160px;"></td>
        <td style="width: 15%;">Last Name:</td>
        <td style="width: 25%;"><input type="text" name="lastName" style="width: 160px;"></td>
      </tr>
      <tr>
        <td>Address #1:</td>
        <td colspan="3"><input type="text" name="address1" style="width: 300px;"></td>
      </tr>
      <tr>
        <td>Address #2:</td>
        <td colspan="3"><input type="text" name="address2" style="width: 300px;"></td>
      </tr>
      <tr>
        <td>City:</td>
        <td><input type="text" name="city" style="width: 180px;"></td>
        <td colspan="2">
          State: <input type="text" name="state" style="width: 50px;">
          Zip: <input type="text" name="zip" style="width: 100px;">
        </td>
      </tr>
      <tr>
        <td>Country:</td>
        <td colspan="3"><input type="text" name="country" value="United States" style="width: 200px;"></td>
      </tr>
    </table>

    <hr>
    <table>
      <tr>
        <td style="width: 25%;">Product:</td>
        <td>
          <select name="product" style="width: 150px;">
            <option value="ScanMaster" selected>ScanMaster</option>
            <option value="PrinterPro">PrinterPro</option>
            <option value="AudioMax">AudioMax</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Date Purchased:</td>
        <td><input type="text" name="datePurchased" style="width: 200px;"></td>
      </tr>
      <tr>
        <td>Serial #:</td>
        <td><input type="text" name="serialNum" style="width: 200px;"></td>
      </tr>
      <tr>
        <td style="vertical-align: top; padding-top: 5px;">Used for:</td>
        <td>
          <div class="options-col">
            <label><input type="radio" name="usedFor" value="Home"> Home</label><br>
            <label><input type="radio" name="usedFor" value="Business" checked> Business</label><br>
            <label><input type="radio" name="usedFor" value="Government"> Government</label>
          </div>
          <div class="options-col">
            <label><input type="radio" name="usedFor" value="Educational Institution"> Educational Institution</label><br>
            <label><input type="radio" name="usedFor" value="Other"> Other</label>
          </div>
        </td>
      </tr>
      <tr>
        <td style="vertical-align: top; padding-top: 5px;">System (check all that apply):</td>
        <td>
          <div class="options-col">
            <label><input type="checkbox" name="system" value="Windows"> Windows</label><br>
            <label><input type="checkbox" name="system" value="Macintosh"> Macintosh</label>
          </div>
          <div class="options-col">
            <label><input type="checkbox" name="system" value="UNIX"> UNIX</label><br>
            <label><input type="checkbox" name="system" value="Other"> Other</label>
          </div>
        </td>
      </tr>
    </table>

    <hr>
    <table>
      <tr>
        <td style="width: 25%; vertical-align: top;">Comments?:</td>
        <td>
          <textarea name="comments" rows="6" style="width: 100%; box-sizing: border-box;"></textarea>
        </td>
      </tr>
    </table>

    <div class="button-container">
      <input type="submit" value="Click to register">
      <input type="reset" value="Click to cancel">
    </div>

  </form>
</div>

</body>
</html>
