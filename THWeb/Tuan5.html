        let valuea = prompt("a", 10);
        let valueb = prompt("b", 10);
        var p = document.createElement('p');
        var pa = document.createElement('p');
        p.textContent = `Số a: ${valuea}`;
        document.body.appendChild(p);
        pa.textContent = `Số b: ${valueb}`;
        document.body.appendChild(pa);
        var buttonc = document.createElement('button');
        var buttont = document.createElement('button');
        var buttonn = document.createElement('button');
        var buttonch = document.createElement('button');
        buttonc.textContent = '+';
        buttont.textContent = '-';
        buttonn.textContent = '*';
        buttonch.textContent = '/';
        document.body.appendChild(buttonc);
        document.body.appendChild(buttont);
        document.body.appendChild(buttonn);
        document.body.appendChild(buttonch);
        buttonc.onclick = () => {
            let valuec = parseInt(valuea) + parseInt(valueb);
            var kqc = document.createElement('p');
            kqc.textContent = `KQcong: ${valuec}`;
            document.body.appendChild (kqc);
        }
         buttont.onclick = () => {
            let valuet  = parseInt(valuea) - parseInt(valueb);
            var kqt = document.createElement('p');
            kqt.textContent = `KQtru: ${valuet}`;
            document.body.appendChild (kqt);
        }
         buttonn.onclick = () => {
            let valuen = parseInt(valuea) * parseInt(valueb);
            var kqn = document.createElement('p');
            kqn.textContent = `KQnhan: ${valuen}`;
            document.body.appendChild (kqn);
        }
         buttonch.onclick = () => {
            let valuech = parseInt(valuea) / parseInt(valueb);
            var kqch = document.createElement('p');
            kqch.textContent = `KQchia: ${valuech}`;
            document.body.appendChild (kqch);
        }
